# Render Deployment Configuration for EV GRID
# Service Name: EV GRID - Charging Infrastructure Intelligence
# Runtime: python
# Build Command: pip install -r requirements.txt
# Start Command: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2

services:
  - type: web
    name: ev-grid-optimizer
    runtime: python
    envVars:
      - key: SECRET_KEY
        value: "render-generated-secret-key-placeholder"
      - key: OPENCHARGEMAP_API_KEY
        value: ""
      - key: ROUTING_API_KEY
        value: ""
      - key: WEATHER_API_KEY
        value: ""
      - key: FLASK_ENV
        value: "production"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2"
    healthCheckPath: "/health"
    plan: free
    region: "us-east"
